# Test kapısı — birim ve uçtan uca.
#
# NEDEN VAR: 2026-08-26'da altı birim testi kırık bulundu. `ProductBuyBox` ve
# `ProductOrderPanel` testleri `aa7ddfa` yeniden tasarımında bayatlamış,
# `messages` testinin mock'u eksik kalmıştı. Hiçbiri fark edilmemişti çünkü
# testleri koşan bir kapı yoktu — `npm test` yalnız elle çalıştırılıyordu.
#
# Kapı, altı test düzeltildikten SONRA açıldı; bugün yeşil başlıyor
# (423 passed, 2 expected fail). Tersini yapmak her PR'ı kırmızıya boyardı —
# aynı sıra `lint.yml`'de de izlendi.
#
# NE DEĞİL: panel/satıcı E2E'leri burada koşmuyor. Onlar docker + Frappe
# cookie-login istiyor (`e2e.sh --panel`); CI'da o yığın yok.
name: Test

on:
  pull_request:
  push:
    branches: [main]
    # Belge değişikliği kodu sınamıyor; koşu açmak kuyruğu boşuna şişiriyor.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".worklog/**"

# Aynı dala arka arkaya push gelirse eski koşu iptal edilir. 2026-08-26'daki
# Actions arızasında koşular saatlerce kuyrukta birikti; iptal olmadan her
# yeni push sırayı bir kat daha uzatıyor.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  birim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Birim testleri (vitest)
        run: npx vitest run

  # Derleme kapısı (21 Eyl 2026, kullanıcı kararı D3).
  #
  # NEDEN SADECE BU KAPI: beş denetim script'i ve pre-commit bilinçli olarak
  # EKLENMEDİ — birden çok geliştirici çalıştığı için o kapılar sık kırmızıya
  # düşüyor ve iş akışını kesiyor. Derleme kapısı farklı: geliştiriciye ya da
  # kod stiline bağlı değil, ya derlenir ya derlenmez.
  #
  # NE YAKALAR: bugüne kadar kırık bir build ancak ALPHA deploy'unda
  # görülüyordu, yani `main`e girdikten SONRA. Vite'ın girdi listesi, statik
  # sayfa eşlemeleri ve PWA precache üretimi yalnız build sırasında koşuyor;
  # birim testleri ve lint bunların hiçbirine bakmıyor.
  derleme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Üretim derlemesi (npm run build)
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Tarayıcı her koşuda yeniden inmesin — indirme tek başına ~1 dakika.
      # Anahtar package-lock'a bağlı: Playwright sürümü değişince önbellek
      # kendiliğinden tazeleniyor.
      - name: Tarayıcı önbelleği
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Yalnız chromium: suite iki projede de (masaüstü + mobil) onu kullanıyor.
      # Önbellek tuttuysa yalnız sistem bağımlılıkları kuruluyor.
      - name: Tarayıcı kurulumu
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Mock-tabanlı spec'ler — backend gerekmiyor, Vite dev server
      # `playwright.config.ts`'teki `webServer` ile kendiliğinden kalkıyor.
      # Panel/satıcı spec'leri hariç (docker + PANEL_PASS ister).
      - name: E2E (mock suite, masaüstü + mobil)
        run: |
          npx playwright test $(ls tests/e2e/*.spec.ts \
            | grep -vE "^tests/e2e/panel-|seller-dashboard-profil|_smoke")

      - name: Başarısızlıkta iz kaydını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izleri
          path: test-results/
          retention-days: 7
